# master_run1_dlgen2_to_ntuple.yaml

# This is the master script that takes dlgen2 files for run1
# and runs them thru my selection to make ntuples. 
# Includes overlay, EXT, and 5e19 data for run1

# Output directory
output_dir: "./output_master_tki_run1"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: False

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    #- /cluster/tufts/wongjiradlabnu/mrosen25/gen2ntuple/submissions/output/
    - /cluster/tufts/wongjiradlabnu/nutufts/data/ntuples/

# Overlay, EXT, data samples 
  run1_bnb_nu_overlay:
    type: RootDataset
    tree: EventTree
    ismc: true
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v5_mcc9_v28_wctagger_bnboverlay.root
     #- dlgen2_reco_v2me05_gen2ntuple_v7_run3b_bnb_nu_overlay_nocrtremerge.root # run3
  run1_extbnb_mcc9_v29e: # C1 only
    type: RootDataset
    tree: EventTree
    ismc: false
    process: true
    filepaths:
    - dlgen2_reco_v2me06_ntuple_v5_mcc9_v29e_dl_run1_C1_extbnb.root
  run1_data_bnb5e19:
    type: RootDataset
    tree: EventTree
    ismc: false
    process: true
    filepaths:
    - dlgen2_reco_v2me05_ntuple_v5_mcc9_v28_wctagger_bnb5e19.root


# Cut configuration
cuts: {}

# Producer configuration
producers:
  eventindex:
    type: eventIndexProducer
    config: {}
  trueNu:
    type: trueNuPropertiesProducer
    config: {}
  eventweight:
    type: eventWeightProducer
    config: {}
  vertex_properties:
    type: VertexPropertiesProducer
    config: {}
  truth_mode:
    type: TruthModeProducer
    config:
      tag_params:
        muKE: 0.0
        pKE: 0.0
        piKE: 0.0
        gKE: 0.0
        ignore_gammas: true
        condense_nuemodes: true
        condense_numumodes: false
  numuCC1piNp:
    type: signalDefinitionCCnumuPiPlusNProton
    config:
      fv_params:
        usetruevtx: true
        width: 5.0
        apply_scc: false
  numuCC1piNpReco:
    type: recoCCnumu1piNprotonProducer
    config: {}