#split_run3_dlgen2_to_ntuple_500k_ext_data.yaml

# This is one piece of the master script that takes dlgen2 files for run3
# and runs them thru my selection to make ntuples. 
# Includes only detector systematics for 500k overlay
# and EXT and 1e19 data for run3

# Output directory
output_dir: "./output_split_tki_run3"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: False

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    - /cluster/tufts/wongjiradlabnu/mrosen25/gen2ntuple/submissions/output/
    - /cluster/tufts/wongjiradlabnu/nutufts/data/ntuples/

  # 500K CV Sample
  run3b_bnb_nu_overlay_500k_CV:
    type: RootDataset
    tree: EventTree
    ismc: true
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v7_mcc9_v40a_dl_run3b_bnb_nu_overlay_500k_CV.root
  run3b_bnb_nu_overlay_500k_SCE:
    type: RootDataset
    tree: EventTree
    ismc: true
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v7_mcc9_v40a_dl_run3b_bnb_nu_overlay_500k_SCE.root
  run3b_bnb_nu_overlay_500k_recomb2:
    type: RootDataset
    tree: EventTree
    ismc: true
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v7_mcc9_v40a_dl_run3b_bnb_nu_overlay_500k_recomb2.root

# EXT and data samples 
  run3_extbnb_mcc9_v29e_hadded: # includes F, G1, G2, G2a
    type: RootDataset
    tree: EventTree
    ismc: false
    process: true
    filepaths:
    - hadded_dlgen2_reco_v2me06_ntuple_v5_mcc9_v29e_dl_run3_F_G1_G2_G2a_extbnb.root
  run3_data_bnb1e19:
    type: RootDataset
    tree: EventTree
    ismc: false
    process: true
    filepaths:
    - ntuple_mcc9_v28_wctagger_run3_bnb1e19_v2_me_06_03_prod.root # dlgen2 file


# Cut configuration
cuts: {}

# Producer configuration
producers:
  eventindex:
    type: eventIndexProducer
    config: {}
  trueNu:
    type: trueNuPropertiesProducer
    config: {}
  eventweight:
    type: eventWeightProducer
    config: {}
  vertex_properties:
    type: VertexPropertiesProducer
    config: {}
  truth_mode:
    type: TruthModeProducer
    config:
      tag_params:
        muKE: 0.0
        pKE: 0.0
        piKE: 0.0
        gKE: 0.0
        ignore_gammas: true
        condense_nuemodes: true
        condense_numumodes: false
  numuCC1piNp:
    type: signalDefinitionCCnumuPiPlusNProton
    config:
      fv_params:
        usetruevtx: true
        width: 5.0
        apply_scc: false
  numuCC1piNpReco:
    type: recoCCnumu1piNprotonProducer
    config: {}