# numu_cc_analysis_config.yaml

# Output directory
output_dir: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4c/root_files/selection/"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: True

# Enable producer-first mode
producer_first_mode: True

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    # Runs 4/5 Nu overlay v10_04_07_20
    - /pnfs/uboone/persistent/users/uboonepro/surprise/retuple/BNB/
    # Nue, Extbnb, Data 
    - /pnfs/uboone/persistent/users/uboonepro/surprise/run4c_full_samples/wc_processed/BNB/

  run4c_nu:
    type: RootDataset
    tree: lantern/EventTree
    pottree: lantern/potTree
    ismc: true
    process: true
    filepaths:
     - checkout_MCC9.10_Run4acd5_v10_04_07_20_BNB_nu_overlay_retuple_retuple_hist_4c.root
    friendtrees: 
      nuselection/NeutrinoSelectionFilter: checkout_MCC9.10_Run4acd5_v10_04_07_20_BNB_nu_overlay_retuple_retuple_hist_4c.root

  run4c_nue:
    type: RootDataset
    tree: lantern/EventTree
    pottree: lantern/potTree
    ismc: true
    process: true
    filepaths:
     - checkout_MCC9.10_Run4c_v10_04_07_13_BNB_intrinsic_nue_overlay_surprise_redo_reco2_hist.root
    friendtrees: 
      nuselection/NeutrinoSelectionFilter: checkout_MCC9.10_Run4c_v10_04_07_13_BNB_intrinsic_nue_overlay_surprise_redo_reco2_hist.root

  run4c_extbnb:
    type: RootDataset
    tree: lantern/EventTree
    pottree: lantern/potTree
    ismc: false
    process: true
    filepaths:
     - checkout_MCC9.10_Run4acd5_v10_04_07_14_BNB_beam_off_surprise_reco2_hist_4c.root
    friendtrees: 
      nuselection/NeutrinoSelectionFilter: checkout_MCC9.10_Run4acd5_v10_04_07_14_BNB_beam_off_surprise_reco2_hist_4c.root

  run4c_data:
    type: RootDataset
    tree: lantern/EventTree
    pottree: lantern/potTree
    ismc: false
    process: true
    filepaths:
     - checkout_MCC9.10_Run4acd5_v10_04_07_14_BNB_beam_on_surprise_reco2_hist_4c.root
    friendtrees: 
      nuselection/NeutrinoSelectionFilter: checkout_MCC9.10_Run4acd5_v10_04_07_14_BNB_beam_on_surprise_reco2_hist_4c.root

producers:
  # Basic physics quantities
  trueNu:
    type: trueNuPropertiesProducer
    config: {}
  eventweight:
    type: eventWeightProducer
    config: {}
  visible_energy:
    type: VisibleEnergyProducer
    config: {}
  
  ## Event index for uncertainties 
  eventIndex: 
    type: eventIndexProducer
    config: {} 

  ## MC event weight 
  eventweight:
    type: eventWeightProducer
    config: {}

  ## Reco vertex properties
  vertex_properties:
    type: VertexPropertiesProducer
    config: {}
  
  ## True vertex properties 
  true_vertex_properties: 
    type: TrueVertexPropertiesProducer
    config: {}

  # electron properties  
  # recoElectron:
  #   type: RecoElectronPropertiesProducer
  #   config:
  #     electron_quality_cuts:
  #       min_charge: 0.0
  #       min_purity: 0.0
  #       min_completeness: 0.0
  
  # muon track properties
  # recoMuonTrack:
  #   type: RecoMuonTrackPropertiesProducer
  #   config:
  #     track_min_energy: 25.0

  # nue signal definition
  nueCCinc:
    type: signalNueCCInclusive
    config:
      fv_params:
        width: 0.0
        apply_scc: false
        usetruevtx: true

  # Truth mode classification
  truth_mode:
    type: TruthModeProducer
    config:
      tag_params:
        eKE: 0.0
        muKE: 0.0
        pKE: 0.0
        piKE: 0.0
        gKE: 0.0
        ignore_gammas: true
        condense_nuemodes: true
        condense_numumodes: true
        condense_ncmodes: true

  ## Numu MMR Cuts
  numuIncCC:
    type: numuIncCCProducer
    config: {}

  ## Nue MMR Cuts
  nueIncCC:
    type: nueIncCCProducer
    config: {}

  ## Remove True Nue CC Producer 
  remove_true_nue_cc_flag: 
    type: RemoveTrueNueCCFlagProducer
    # applyto: # Nu overlay (doesn't work)
    #   - run3b_bnb_nue_overlay
    

