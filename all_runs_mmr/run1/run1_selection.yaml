# Output directory
output_dir: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run1/root_files/selection_wfinals/"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: True

# Enable producer-first mode
producer_first_mode: True

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    - /cluster/tufts/wongjiradlabnu/mrosen25/gen2ntuple/submissions/output/
    - /cluster/tufts/wongjiradlabnu/nutufts/data/ntuples/
    - /exp/uboone/data/users/imani/ntuples/run1/
    - /pnfs/uboone/persistent/users/uboonepro/surprise/run1_full_samples/wc_processed/BNB/
 
  run1_nu:
    type: RootDataset
    tree: EventTree
    pottree: potTree
    ismc: true
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v5_mcc9_v28_wctagger_bnboverlay.root

  run1_nue:
    type: RootDataset
    tree: EventTree
    pottree: potTree
    ismc: true
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v5_mcc9_v28_wctagger_nueintrinsics.root

  run1_extbnb:
    type: RootDataset
    tree: EventTree
    pottree: potTree
    ismc: false
    process: true
    filepaths:
     - dlgen2_reco_v2me06_ntuple_v5_mcc9_v29e_dl_run1_C1_extbnb.root

  run1_data_5e19:
    type: RootDataset
    tree: EventTree
    ismc: false
    process: true
    filepaths:
    - dlgen2_reco_v2me05_ntuple_v5_mcc9_v28_wctagger_bnb5e19.root

  run1surp_nu:
    type: RootDataset
    tree: lantern/EventTree
    pottree: lantern/potTree
    ismc: true
    process: true
    filepaths:
     - checkout_wc_train_MCC9.10_Run123_v10_04_07_20_BNB_nu_overlay_surprise_reco2_hist_1.root
    friendtrees: 
      nuselection/NeutrinoSelectionFilter: checkout_wc_train_MCC9.10_Run123_v10_04_07_20_BNB_nu_overlay_surprise_reco2_hist_1.root

# Producer configuration (producers run first)
producers:
  # Basic physics quantities
  trueNu:
    type: trueNuPropertiesProducer
    config: {}
  eventweight:
    type: eventWeightProducer
    config: {}
  visible_energy:
    type: VisibleEnergyProducer
    config: {}
  eventIndex: 
    type: eventIndexProducer
    config: {} 
  
  # True vertex properties 
  true_vertex_properties: 
    type: TrueVertexPropertiesProducer
    config: {}

  # Truth mode classification
  truth_mode:
    type: TruthModeProducer
    config:
      tag_params:
        eKE: 0.0
        muKE: 0.0
        pKE: 0.0
        piKE: 0.0
        gKE: 0.0
        ignore_gammas: true
        condense_nuemodes: true
        condense_numumodes: true
        condense_ncmodes: true

  # Numu MMR Cuts
  numuIncCC:
    type: numuIncCCProducer
    config: {}

  # Nue MMR Cuts
  nueIncCC:
    type: nueIncCCProducer
    config: {}

  ## Remove True Nue CC Producer
  remove_true_nue_cc_flag:
    type: RemoveTrueNueCCFlagProducer

  ## Final State Particles Reco & Truth
  finalStateParticles:
    type: finalStateParticlesProducer
    config: {}
