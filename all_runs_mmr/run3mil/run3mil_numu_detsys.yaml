
# Output directory
output_dir: "/cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_final/"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: True

# Enable producer-first mode
producer_first_mode: True

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    - /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/
    - /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3/root_files/detsys/
    - /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/selection/


  run3b_nu_CV:
    type: RootDataset
    tree: analysis_tree
    ismc: true
    process: true
    filepaths:
      - run3mil_nu_20260122_162913.root

  run3b_nu_CV_500k:
    type: RootDataset
    tree: analysis_tree
    ismc: true
    process: true
    filepaths:
      - run3b_bnb_nu_overlay_500k_CV_20260113_004057.root


# Producer configuration (producers run first)
producers:
  detsys_cv100k:
    type: UBDetSysProducer
    config:
      variations_to_include:
        - LYAtt
        - LYDown
        - LYRayleigh
        - wiremodX
        - wiremodYZ
        - wiremodThetaXZ
        - wiremodThetaYZ        
      run: eventIndex_run
      subrun: eventIndex_subrun
      event: eventIndex_event
      central_value_dataset: run3b_nu_CV
      variation_rootfiles:
        LYAtt:      /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_LYAtt_20260206_143618.root
        LYDown:     /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_LYDown_20260122_165700.root
        LYRayleigh: /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_LYRayleigh_20260122_172109.root
        wiremodX:   /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_wiremodX_20260122_174713.root
        wiremodYZ:  /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_wiremodYZ_20260122_181421.root
        wiremodThetaYZ: /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_wiremodThetaYZ_20260122_190956.root
        wiremodThetaXZ: /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3mil/root_files/detsys_selection/run3mil_nu_wiremodThetaXZ_20260122_184207.root
      variation_treename: analysis_tree
      cut_formulas:
        mmr_cuts_nu: "{ntuple.numuIncCC_passes_all_cuts}==1 and 
                    {ntuple.remove_true_nue_cc_flag}!=1
                    "
        mmr_cuts_nue: "{ntuple.numuIncCC_passes_all_cuts}==1
                    "
      event_selection_critera: ['mmr_cuts_nu']
      bin_config: 
        visible_energy:
          formula: visible_energy
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          applicable_variations:
           - 'LYAtt'
           - 'LYDown'
           - 'LYRayleigh'
           - 'wiremodX'
           - 'wiremodYZ'
           - 'wiremodThetaXZ'
           - 'wiremodThetaYZ'
        reco_neutrino_energy: 
          formula: vertex_properties_recoEnuMeV
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          applicable_variations:
           - 'LYAtt'
           - 'LYDown'
           - 'LYRayleigh'
           - 'wiremodX'
           - 'wiremodYZ'
           - 'wiremodThetaXZ'
           - 'wiremodThetaYZ'
        reco_muon_momentum: 
          formula: numuIncCC_reco_muon_momentum
          numbins: 30
          minvalue: 0.0
          maxvalue: 1.5
          applicable_variations:
           - 'LYAtt'
           - 'LYDown'
           - 'LYRayleigh'
           - 'wiremodX'
           - 'wiremodYZ'
           - 'wiremodThetaXZ'
           - 'wiremodThetaYZ'
        reco_cos_theta: 
          formula: numuIncCC_reco_muon_costheta
          numbins: 40
          minvalue: -1
          maxvalue: 1
          applicable_variations:
           - 'LYAtt'
           - 'LYDown'
           - 'LYRayleigh'
           - 'wiremodX'
           - 'wiremodYZ'
           - 'wiremodThetaXZ'
           - 'wiremodThetaYZ'

  detsys_cv500k:
    type: UBDetSysProducer
    config:
      variations_to_include:
        - SCE
        - recomb2
      run: eventIndex_run
      subrun: eventIndex_subrun
      event: eventIndex_event
      central_value_dataset: run3b_nu_CV_500k
      variation_rootfiles:
        SCE: /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3/root_files/detsys/run3b_bnb_nu_overlay_500k_SCE_20260113_005427.root
        recomb2: /cluster/tufts/wongjiradlabnu/zimani01/lantern/lantern_ana/all_runs_mmr/run3/root_files/detsys/run3b_bnb_nu_overlay_500k_recomb2_20260113_010129.root
      variation_treename: analysis_tree
      cut_formulas:
        mmr_cuts_nu: "{ntuple.numuIncCC_passes_all_cuts}==1 and 
                    {ntuple.remove_true_nue_cc_flag}!=1
                    "
        mmr_cuts_nue: "{ntuple.numuIncCC_passes_all_cuts}==1
                    "
      event_selection_critera: ['mmr_cuts_nu']
      bin_config: 
        visible_energy:
          formula: visible_energy
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          applicable_variations:
           - 'SCE'
           - 'recomb2'
        reco_neutrino_energy: 
          formula: vertex_properties_recoEnuMeV
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          applicable_variations:
           - 'SCE'
           - 'recomb2'
        reco_muon_momentum: 
          formula: numuIncCC_reco_muon_momentum
          numbins: 30
          minvalue: 0.0
          maxvalue: 1.5
          applicable_variations:
           - 'SCE'
           - 'recomb2'
        reco_cos_theta: 
          formula: numuIncCC_reco_muon_costheta
          numbins: 40
          minvalue: -1
          maxvalue: 1
          applicable_variations:
           - 'SCE'
           - 'recomb2'
