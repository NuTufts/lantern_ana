# Output directory
output_dir: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run3_surprise/root_files/xsecflux/logs/"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: True

# Enable producer-first mode
producer_first_mode: True

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    - /exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run3_surprise/root_files/selection/

  run3surp_nu:
    type: RootDataset
    tree: analysis_tree
    pottree: lifetime_tree
    ismc: true
    process: true
    filepaths:
     - run3surp_nu_20260507_194227.root
  
  # run3surp_nue:
  #   type: RootDataset
  #   tree: analysis_tree
  #   pottree: lifetime_tree
  #   ismc: true
  #   process: true
  #   filepaths:
  #    - xxx.root

  # run3surp_dirt: 
  #   type: RootDataset
  #   tree: analysis_tree
  #   pottree: lifetime_tree
  #   ismc: true
  #   process: true
  #   filepaths:
  #    - xxx.root

# Producer configuration (producers run first)
producers:
  xsfluxweight:
    type: ArboristXsecFluxSysProducer
    config:
      run: eventIndex_run
      subrun: eventIndex_subrun
      event: eventIndex_event
      maxvalidweight: 1000.0
      allow_missing_weights: True
      tree: nuselection/NeutrinoSelectionFilter
      weight_tree_run: "run"
      weight_tree_subrun: "sub"
      weight_tree_event: "evt"
      weight_branch_type: 1 # surprise files 
      rootfilepaths:
        run3surp_nu: "/pnfs/uboone/persistent/users/uboonepro/surprise/run3_full_samples/wc_processed/BNB/checkout_MCC9.10_Run123_v10_04_07_20_BNB_nu_overlay_surprise_reco2_hist_3.root"
        # run3surp_nue: "xxx"
      par_variations_to_include:
        - reint_all
        - Theta_Delta2Npi_UBGenie
        - ThetaDelta2NRad_UBGenie
        - NormNCCOH_UBGenie
        - NormCCCOH_UBGenie
        - xsr_scc_Fv3_SCC
        - xsr_scc_Fa3_SCC
        - VecFFCCQEshape_UBGenie
        - AxFFCCQEshape_UBGenie
        - RPA_CCQE_UBGenie
        - DecayAngMEC_UBGenie
        - XSecShape_CCMEC_UBGenie
        - All_UBGenie
        - flux_all
        - RootinoFix_UBGenie        # Ignore? 
        - TunedCentralValue_UBGenie # Ignore?
        - ppfx_all                  # Ignore? 
        - splines_general_Spline    # Ignore?
      cut_formulas:
        mmr_cuts_nu: "{ntuple.numuIncCC_passes_all_cuts}==1 and 
                    {ntuple.remove_true_nue_cc_flag}!=1
                    "
        mmr_cuts_nue: "{ntuple.numuIncCC_passes_all_cuts}==1
                    "
      event_selection_critera: ['mmr_cuts_nu'] 
      bin_config: 
        visible_energy:
          formula: visible_energy
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          apply_to_datasets: [run3surp_nu]
          criteria: []
        reco_neutrino_energy: 
          formula: numuIncCC_reco_nu_energy
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          apply_to_datasets: [run3surp_nu]
          criteria: []
        reco_muon_momentum: 
          formula: numuIncCC_reco_muon_momentum
          numbins: 30
          minvalue: 0.0
          maxvalue: 1.5
          apply_to_datasets: [run3surp_nu]
          criteria: []
        reco_cos_theta: 
          formula: numuIncCC_reco_muon_costheta
          numbins: 40
          minvalue: -1
          maxvalue: 1
          apply_to_datasets: [run3surp_nu]
          criteria: []