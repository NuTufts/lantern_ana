# numu_cc_analysis_config.yaml

# Output directory
output_dir: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run3_surprise/root_files/selection/"

# Maximum events to process (set to -1 for all events)
max_events: -1

# Filter out failed events from output tree
filter_events: True

# Enable producer-first mode
producer_first_mode: True

# Print producer dependency graph
print_dependency_graph: true

# Dataset configuration
datasets:
  folders:
    - /pnfs/uboone/persistent/users/uboonepro/surprise/temp/

  run3surp_nu:
    type: RootDataset
    tree: lantern/EventTree
    pottree: lantern/potTree
    ismc: true
    process: true
    filepaths:
     - checkout_temp_MCC9.10_Run123_v10_04_07_20_BNB_nu_overlay_surprise_reco2_hist_3_all.root
    friendtrees: 
      nuselection/NeutrinoSelectionFilter: checkout_temp_MCC9.10_Run123_v10_04_07_20_BNB_nu_overlay_surprise_reco2_hist_3_all.root


producers:
  # Basic physics quantities
  trueNu:
    type: trueNuPropertiesProducer
    config: {}
  eventweight:
    type: eventWeightProducer
    config: {}
  visible_energy:
    type: VisibleEnergyProducer
    config: {}
  
  ## Event index for uncertainties 
  eventIndex: 
    type: eventIndexProducer
    config: {} 

  ## MC event weight 
  eventweight:
    type: eventWeightProducer
    config: {}

  ## Reco vertex properties
  vertex_properties:
    type: VertexPropertiesProducer
    config: {}
  
  ## True vertex properties 
  true_vertex_properties: 
    type: TrueVertexPropertiesProducer
    config: {}

  # electron properties  
  # recoElectron:
  #   type: RecoElectronPropertiesProducer
  #   config:
  #     electron_quality_cuts:
  #       min_charge: 0.0
  #       min_purity: 0.0
  #       min_completeness: 0.0
  
  # muon track properties
  # recoMuonTrack:
  #   type: RecoMuonTrackPropertiesProducer
  #   config:
  #     track_min_energy: 25.0

  # nue signal definition
  nueCCinc:
    type: signalNueCCInclusive
    config:
      fv_params:
        width: 0.0
        apply_scc: false
        usetruevtx: true

  # Truth mode classification
  truth_mode:
    type: TruthModeProducer
    config:
      tag_params:
        eKE: 0.0
        muKE: 0.0
        pKE: 0.0
        piKE: 0.0
        gKE: 0.0
        ignore_gammas: true
        condense_nuemodes: true
        condense_numumodes: true
        condense_ncmodes: true

  ## Numu MMR Cuts
  numuIncCC:
    type: numuIncCCProducer
    config: {}

  ## Nue MMR Cuts
  nueIncCC:
    type: nueIncCCProducer
    config: {}

  ## Remove True Nue CC Producer 
  remove_true_nue_cc_flag: 
    type: RemoveTrueNueCCFlagProducer
