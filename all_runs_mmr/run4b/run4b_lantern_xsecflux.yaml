# run4b_lantern_xsecflux.yaml
#
# Produces xsec+flux systematic uncertainty histograms for all numu FSP
# channels (inclusive CC, pi0, 0p, Np) from BOTH the run4b BNB nu overlay
# and nue overlay samples in a single pass.
#
# Nu overlay (run4b_nu):  numu-passing events with remove_true_nue_cc_flag!=1,
#   excluding intrinsic nue CC to avoid double-counting with the nue overlay.
# Nue overlay (run4b_nue): intrinsic nue CC events passing numu selection,
#   providing the nue CC background systematic for all FSP channels.
# Per-dataset criteria_overrides in bin_config apply the correct flag cut
#   to run4b_nu while letting run4b_nue use the looser pass_any gate.
#
# Output: xsecflux_numu_combined_run4b.root
#
# In plot_numu.py, point both xsecflux_files entries for run4b to this file:
#   "numu_4b": ".../xsecflux_numu_combined_run4b.root"
#   "nue_4b":  ".../xsecflux_numu_combined_run4b.root"

output_dir: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4b/root_files/xsecflux/logs/"

max_events: -1
filter_events: True
producer_first_mode: True
print_dependency_graph: true

datasets:
  folders:
    - /exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4b/root_files/selection/

  run4b_nu:
    type: RootDataset
    tree: analysis_tree
    pottree: lifetime_tree
    ismc: true
    process: true
    filepaths:
      - run4b_nu_20260706_170915.root

  run4b_nue:
    type: RootDataset
    tree: analysis_tree
    pottree: lifetime_tree
    ismc: true
    process: true
    filepaths:
      - run4b_nue_20260706_175100.root

producers:
  xsfluxweight:
    type: ArboristXsecFluxSysProducer
    config:
      output_filename: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4b/root_files/xsecflux/xsecflux_numu_combined_run4b.root"
      run: eventIndex_run
      subrun: eventIndex_subrun
      event: eventIndex_event
      maxvalidweight: 1000.0
      allow_missing_weights: True
      tree: nuselection/NeutrinoSelectionFilter
      weight_tree_run: "run"
      weight_tree_subrun: "sub"
      weight_tree_event: "evt"
      weight_branch_type: 1   # surprise files
      rootfilepaths:
        run4b_nu:  "/pnfs/uboone/persistent/users/uboonepro/surprise/retuple/BNB/MCC9.10_Run4b_v10_04_07_20_BNB_nu_overlay_retuple_retuple_hist.root"
        run4b_nue: "/pnfs/uboone/persistent/users/uboonepro/surprise/run4b_full_samples/BNB/MCC9.10_Run4b_v10_04_07_09_BNB_nue_overlay_surprise_reco2_hist.root"
      par_variations_to_include:
        - reint_all
        - Theta_Delta2Npi_UBGenie
        - ThetaDelta2NRad_UBGenie
        - NormNCCOH_UBGenie
        - NormCCCOH_UBGenie
        - xsr_scc_Fv3_SCC
        - xsr_scc_Fa3_SCC
        - VecFFCCQEshape_UBGenie
        - AxFFCCQEshape_UBGenie
        - RPA_CCQE_UBGenie
        - DecayAngMEC_UBGenie
        - XSecShape_CCMEC_UBGenie
        - All_UBGenie
        - flux_all
        - RootinoFix_UBGenie
        - TunedCentralValue_UBGenie
        - ppfx_all
        - splines_general_Spline

      # -----------------------------------------------------------------
      # Cut formulas
      #
      # pass_any: global gate — admits all numu-passing events from both
      #   datasets (no flag cut so nue overlay events are processed too).
      # mmr_numu: nu overlay numu signal, flag cut removes true nue CC
      #   contamination from the nu file.
      # reco_nu_energy_numu uses criteria_overrides so run4b_nu gets
      #   mmr_numu (flag cut) and run4b_nue gets pass_any (no flag cut).
      # -----------------------------------------------------------------
      cut_formulas:

        # Global gate: all numu-passing events from either sample
        pass_any: >-
          {ntuple.numuIncCC_passes_all_cuts}==1

        # Numu inclusive CC with flag cut (nu overlay)
        mmr_numu: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1

        # Pi0 channel: numu CC + pi0Properties box cuts
        mmr_pi0: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1
          and {ntuple.pi0Properties_reco_inv_mass}>0
          and {ntuple.pi0Properties_reco_cos_opening_angle}<-0.5
          and ({ntuple.pi0Properties_reco_delta_mass}<0
               or ({ntuple.pi0Properties_reco_delta_mass}>=1000
                   and {ntuple.pi0Properties_reco_delta_mass}<=1400))

        # 0p channel: numu CC + no reconstructed proton
        mmr_0p: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1
          and sum(1 for _p in {ntuple.finalStateParticles_reco_shower_pid} if _p==2212)==0
          and sum(1 for _p in {ntuple.finalStateParticles_reco_track_pid} if _p==2212)==0

        # Np channel: numu CC + at least one reconstructed proton
        mmr_Np: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1
          and (sum(1 for _p in {ntuple.finalStateParticles_reco_shower_pid} if _p==2212)>0
               or sum(1 for _p in {ntuple.finalStateParticles_reco_track_pid} if _p==2212)>0)

      event_selection_critera: ['pass_any']

      # -----------------------------------------------------------------
      # Bin configuration
      #
      # reco_nu_energy_numu — numuIncCC_reco_nu_energy, 20 bins 0-2 GeV.
      #   Covers BOTH run4b_nu and run4b_nue using criteria_overrides:
      #     run4b_nu  → mmr_numu (flag cut, excludes true nue CC)
      #     run4b_nue → pass_any (no flag cut, all nue CC bkg included)
      #   This produces hreco_nu_energy_numu_run4b_nu_* and
      #   hreco_nu_energy_numu_run4b_nue_* in the same ROOT file without
      #   double-counting nue CC events.
      #
      # reco_nu_energy_{pi0,0p,Np} — nu overlay only, flag cut applied via
      #   mmr_{pi0,0p,Np}. plot_numu.py reads only reco_nu_energy_numu for
      #   all FSP channels; these entries exist for standalone checks.
      #
      # visible_energy — nu overlay only, for backward compatibility.
      # -----------------------------------------------------------------
      bin_config:

        reco_nu_energy_numu:
          formula: numuIncCC_reco_nu_energy
          numbins: 20
          minvalue: 0.0
          maxvalue: 2.0
          apply_to_datasets: [run4b_nu, run4b_nue]
          criteria: ['pass_any']
          criteria_overrides:
            run4b_nu: ['mmr_numu']

        reco_nu_energy_pi0:
          formula: numuIncCC_reco_nu_energy
          numbins: 20
          minvalue: 0.0
          maxvalue: 2.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_pi0']

        reco_nu_energy_0p:
          formula: numuIncCC_reco_nu_energy
          numbins: 20
          minvalue: 0.0
          maxvalue: 2.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_0p']

        reco_nu_energy_Np:
          formula: numuIncCC_reco_nu_energy
          numbins: 20
          minvalue: 0.0
          maxvalue: 2.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_Np']

        visible_energy:
          formula: visible_energy
          numbins: 60
          minvalue: 0.0
          maxvalue: 3000.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_numu']
