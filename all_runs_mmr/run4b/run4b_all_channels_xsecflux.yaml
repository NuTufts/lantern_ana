# run4b_all_channels_xsecflux.yaml
#
# Produces xsec+flux systematic uncertainty histograms for all five analysis
# channels in a single pass, enabling a joint (nue, numu, pi0, 0p, Np)
# covariance matrix.
#
# Channels and required selection files:
#   numu  — numuIncCC_passes_all_cuts  (run4b_nu)    [works now]
#   nue   — nueIncCC_passes_all_cuts   (run4b_nue)   [works now]
#   pi0   — numu + pi0Properties cuts  (run4b_nu)    [requires regenerated selection w/ pi0PropertiesProducer]
#   0p    — numu + 0 reco protons      (run4b_nu)    [requires regenerated selection w/ finalStateParticlesProducer]
#   Np    — numu + >=1 reco proton     (run4b_nu)    [requires regenerated selection w/ finalStateParticlesProducer]
#
# Output: xsecflux histograms with reco neutrino energy (GeV) per channel,
#         ready for make_covar_matrices.py.

output_dir: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4b/root_files/xsecflux/logs/"

max_events: -1
filter_events: True
producer_first_mode: True
print_dependency_graph: true

datasets:
  folders:
    - /exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4b/root_files/selection/

  run4b_nu:
    type: RootDataset
    tree: analysis_tree
    pottree: lifetime_tree
    ismc: true
    process: true
    filepaths:
      - run4b_nu_20260706_170915.root

  run4b_nue:
    type: RootDataset
    tree: analysis_tree
    pottree: lifetime_tree
    ismc: true
    process: true
    filepaths:
      - run4b_nue_20260706_175100.root

producers:
  xsfluxweight:
    type: ArboristXsecFluxSysProducer
    config:
      output_filename: "/exp/uboone/app/users/imani/lantern_ana/all_runs_mmr/run4b/root_files/xsecflux/xsecflux_allchannels_run4b.root"
      run: eventIndex_run
      subrun: eventIndex_subrun
      event: eventIndex_event
      maxvalidweight: 1000.0
      allow_missing_weights: True
      tree: nuselection/NeutrinoSelectionFilter
      weight_tree_run: "run"
      weight_tree_subrun: "sub"
      weight_tree_event: "evt"
      weight_branch_type: 1   # surprise files
      rootfilepaths:
        run4b_nu:  "/pnfs/uboone/persistent/users/uboonepro/surprise/retuple/BNB/MCC9.10_Run4b_v10_04_07_20_BNB_nu_overlay_retuple_retuple_hist.root"
        run4b_nue: "/pnfs/uboone/persistent/users/uboonepro/surprise/run4b_full_samples/BNB/MCC9.10_Run4b_v10_04_07_09_BNB_nue_overlay_surprise_reco2_hist.root"
      par_variations_to_include:
        - reint_all
        - Theta_Delta2Npi_UBGenie
        - ThetaDelta2NRad_UBGenie
        - NormNCCOH_UBGenie
        - NormCCCOH_UBGenie
        - xsr_scc_Fv3_SCC
        - xsr_scc_Fa3_SCC
        - VecFFCCQEshape_UBGenie
        - AxFFCCQEshape_UBGenie
        - RPA_CCQE_UBGenie
        - DecayAngMEC_UBGenie
        - XSecShape_CCMEC_UBGenie
        - All_UBGenie
        - flux_all
        - RootinoFix_UBGenie         # Ignore?
        - TunedCentralValue_UBGenie  # Ignore?
        - ppfx_all                   # Ignore?
        - splines_general_Spline     # Ignore?

      # -----------------------------------------------------------------
      # Cut formulas
      #   {ntuple.X} placeholders are resolved per-event by the producer.
      #   Vector branch iteration (sum(...)) requires updated selection files
      #   that include finalStateParticlesProducer / pi0PropertiesProducer.
      # -----------------------------------------------------------------
      cut_formulas:

        # Global pass: event passes at least one channel selection
        pass_any: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          or {ntuple.nueIncCC_passes_all_cuts}==1

        # numu inclusive CC (nu sample, remove intrinsic nue CC contamination)
        mmr_numu: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1

        # nue inclusive CC (nue intrinsic-overlay sample)
        mmr_nue: >-
          {ntuple.nueIncCC_passes_all_cuts}==1

        # pi0 channel: numu CC + pi0Properties box cuts
        # Requires pi0PropertiesProducer in selection (reco_inv_mass > 0 means all box cuts passed;
        # delta_mass < 0 means no proton track found, or 1000-1400 MeV is the Delta(1232) window)
        mmr_pi0: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1
          and {ntuple.pi0Properties_reco_inv_mass}>0
          and {ntuple.pi0Properties_reco_cos_opening_angle}<-0.5
          and ({ntuple.pi0Properties_reco_delta_mass}<0
               or ({ntuple.pi0Properties_reco_delta_mass}>=1000
                   and {ntuple.pi0Properties_reco_delta_mass}<=1400))

        # 0p channel: numu CC + no reconstructed proton in final state
        # Requires finalStateParticlesProducer in selection
        mmr_0p: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1
          and sum(1 for _p in {ntuple.finalStateParticles_reco_shower_pid} if _p==2212)==0
          and sum(1 for _p in {ntuple.finalStateParticles_reco_track_pid} if _p==2212)==0

        # Np channel: numu CC + at least one reconstructed proton in final state
        # Requires finalStateParticlesProducer in selection
        mmr_Np: >-
          {ntuple.numuIncCC_passes_all_cuts}==1
          and {ntuple.remove_true_nue_cc_flag}!=1
          and (sum(1 for _p in {ntuple.finalStateParticles_reco_shower_pid} if _p==2212)>0
               or sum(1 for _p in {ntuple.finalStateParticles_reco_track_pid} if _p==2212)>0)

      # Global gate: keep events that pass at least one of the above channels
      event_selection_critera: ['pass_any']

      # -----------------------------------------------------------------
      # Bin configuration — one reco-neutrino-energy spectrum per channel.
      # Energy from numuIncCC / nueIncCC is in GeV (recoNuE / 1000).
      # criteria entries must match cut_formula names defined above;
      # the bin is skipped for events that fail any listed criterion.
      # -----------------------------------------------------------------
      bin_config:

        reco_energy_numu:
          formula: numuIncCC_reco_nu_energy
          numbins: 30
          minvalue: 0.0
          maxvalue: 3.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_numu']

        reco_energy_nue:
          formula: nueIncCC_reco_nu_energy
          numbins: 30
          minvalue: 0.0
          maxvalue: 3.0
          apply_to_datasets: [run4b_nue]
          criteria: ['mmr_nue']

        reco_energy_pi0:
          formula: numuIncCC_reco_nu_energy
          numbins: 30
          minvalue: 0.0
          maxvalue: 3.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_pi0']

        reco_energy_0p:
          formula: numuIncCC_reco_nu_energy
          numbins: 30
          minvalue: 0.0
          maxvalue: 3.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_0p']

        reco_energy_Np:
          formula: numuIncCC_reco_nu_energy
          numbins: 30
          minvalue: 0.0
          maxvalue: 3.0
          apply_to_datasets: [run4b_nu]
          criteria: ['mmr_Np']
